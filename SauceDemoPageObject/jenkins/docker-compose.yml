services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
    depends_on:
      - selenium

  selenium:
    image: selenium/standalone-chromium:4.49.0
    container_name: selenium
    shm_size: 2gb
    ports:
      - "127.0.0.1:4444:4444"

volumes:
  jenkins_home:
